<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Eventos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🎉 Sistema de Gerenciamento de Eventos</h1>

<div class="container">

  <h2>Cadastrar Evento</h2>
  <input type="text" id="nome" placeholder="Nome">
  <input type="date" id="data">
  <input type="text" id="local" placeholder="Local">
  <input type="text" id="descricao" placeholder="Descrição">
  <button onclick="adicionarEvento()">Salvar</button>

  <h2>Eventos</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Data</th>
        <th>Local</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="listaEventos"></tbody>
  </table>

</div>

<script src="script.js"></script>
</body>
</html>
